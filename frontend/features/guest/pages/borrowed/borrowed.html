<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borrowed Books | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/confirmation.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
  </head>
  <body data-app-page="guest-borrowed">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="guest">
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Borrowed Books</h1>
          <div class="topbar-user">
            <span class="user-role">Guest / Visitor</span>
          </div>
        </header>
        <div class="content" data-page="guest-borrowed">
          <h2 class="mb-4">Borrowed Books</h2>
          <div id="borrowed-books">
            <div class="alert alert-light border">
              You have no currently borrowed books.
            </div>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/core/media.js"
      defer
    ></script>
    <script
      src="/scan2borrow/frontend/features/guest/pages/borrowed/guest-borrowed.page.js"
      type="module"
      defer
    ></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
