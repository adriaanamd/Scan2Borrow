<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Browse Books | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
  </head>
  <body data-app-page="guest-browse">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="guest">
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Browse Books</h1>
          <div class="topbar-user">
            <span class="user-role">Guest / Visitor</span>
          </div>
        </header>
        <div class="content" data-page="guest-browse">
          <h2>Browse Books</h2>
          <p class="text-muted">
            Books are released only after librarian review.
          </p>
          <form class="row g-2 mb-3" id="guest-browse-form">
            <div class="col-md-6">
              <input
                class="form-control"
                name="q"
                placeholder="Search title, author, ISBN, or category"
              />
            </div>
            <div class="col-md-4">
              <select class="form-select" name="category">
                <option value="">All categories</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-success w-100">Search</button>
            </div>
          </form>
          <div class="row g-3" id="guest-book-results">
            <p class="text-muted">No available books found.</p>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/core/media.js"
      defer
    ></script>
    <script
      src="/scan2borrow/frontend/features/guest/pages/browse/guest-browse.page.js"
      type="module"
      defer
    ></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
