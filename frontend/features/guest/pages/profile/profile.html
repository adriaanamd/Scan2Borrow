<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>My Profile | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/confirmation.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
  </head>
  <body data-app-page="guest-profile">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="guest">
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">My Profile</h1>
          <div class="topbar-user">
            <span class="user-role">Guest / Visitor</span>
          </div>
        </header>
        <div class="content" data-page="guest-profile">
          <h2 class="mb-3">Settings</h2>
          <div id="form-error" class="alert alert-danger" hidden></div>
          <div id="form-success" class="alert alert-success" hidden></div>
          <div class="card">
            <div class="card-body">
              <div class="alert alert-info small">
                Government ID type, ID barcode, visitor number, and verification
                status can only be changed by a librarian.
              </div>
              <form method="post" id="guest-profile-form">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Contact Number *</label
                    ><input class="form-control" name="contact_no" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email</label
                    ><input class="form-control" name="email" type="email" />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">House No. *</label
                    ><input class="form-control" name="house_no" required />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Street *</label
                    ><input class="form-control" name="street" required />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Barangay *</label
                    ><input class="form-control" name="barangay" required />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Municipality/City *</label
                    ><input class="form-control" name="municipality" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Province *</label
                    ><input class="form-control" name="province" required />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Purpose *</label
                    ><select name="purpose" class="form-select">
                      <option>Research</option>
                      <option>Reading</option>
                      <option>Thesis</option>
                      <option>Review</option>
                      <option>Others</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Other purpose</label
                    ><input class="form-control" name="purpose_other" />
                  </div>
                </div>
                <button class="btn btn-success mt-4">Save Changes</button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/scan2borrow/frontend/features/guest/pages/profile/guest-profile.page.js"></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
