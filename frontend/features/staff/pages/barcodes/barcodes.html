<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barcode PDF Export | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/features/staff/pages/barcodes/barcodes.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js" defer></script>
  </head>
  <body data-app-page="staff-barcode-print">
    <main class="barcode-print-shell">
      <header class="barcode-print-toolbar no-print">
        <div>
          <p class="eyebrow">Scan2Borrow · Library inventory</p>
          <h1>Barcode label export</h1>
          <p id="print-subtitle" class="text-muted mb-0">Loading immutable label batch...</p>
        </div>
        <div class="d-flex gap-2 align-items-start">
          <button type="button" id="print-pdf" class="btn btn-primary" disabled>Export PDF</button>
          <button type="button" id="close-print" class="btn btn-outline-secondary">Close</button>
        </div>
      </header>
      <div id="print-notice" class="alert alert-info no-print">The export batch is already marked printed. Use your browser's print dialog and choose <strong>Save as PDF</strong>.</div>
      <div id="print-error" class="alert alert-danger no-print d-none"></div>
      <section id="barcode-labels" class="barcode-label-grid" aria-live="polite">
        <div class="barcode-loading">Preparing barcode labels...</div>
      </section>
    </main>
    <script type="module" src="/scan2borrow/frontend/features/staff/pages/barcodes/barcodes.page.js"></script>
  </body>
</html>
