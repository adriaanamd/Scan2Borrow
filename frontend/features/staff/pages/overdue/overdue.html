<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Overdue Books | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/confirmation.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body data-app-page="staff-overdue">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="session">
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Overdue Books</h1>
          <div class="topbar-user"><span class="user-role">Staff</span></div>
        </header>
        <div class="content" data-page="staff-overdue">
          <div class="page-head">
            <div>
              <p>
                Borrowed books past their due date. Fines update automatically
                each day.
              </p>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-3 col-6">
              <div class="stat-card stat-danger">
                <div class="icon">&#9888;</div>
                <div>
                  <div class="label">Overdue Borrowed Books</div>
                  <div class="value"></div>
                </div>
              </div>
            </div>
            <div class="col-md-3 col-6">
              <div class="stat-card stat-warning">
                <div class="icon">&#128176;</div>
                <div>
                  <div class="label">Total Fines</div>
                  <div class="value"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="table-card">
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Borrower</th>
                    <th>Book</th>
                    <th>Quantity</th>
                    <th>Due Date</th>
                    <th>Days Late</th>
                    <th>Fine</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="7" class="text-center text-muted">
                      No overdue books. &#127881;
                    </td>
                  </tr>

                  <tr class="row-overdue">
                    <td><br /><span class="text-muted small"></span></td>
                    <td></td>
                    <td></td>
                    <td><span class="badge bg-danger"> day(s)</span></td>
                    <td></td>
                    <td>
                      <a
                        href="/scan2borrow/staff/notify?id="
                        class="btn btn-warning btn-sm"
                        >Email Reminder</a
                      >
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/core/media.js"
      defer
    ></script>
    <script type="module" src="/scan2borrow/frontend/features/staff/pages/overdue/entry.js"></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
