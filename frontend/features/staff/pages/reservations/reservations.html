<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Reservations | Scan2Borrow</title>
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/reservations.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/confirmation.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
  </head>
  <body data-app-page="staff-reservations">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="session"></aside>
      <main class="main">
        <header class="topbar"><h1 class="topbar-title">Reservations</h1><div class="topbar-user"><span class="user-role">Staff</span></div></header>
        <div class="content" data-page="staff-reservations">
          <div class="page-head"><div><span class="staff-reservations__eyebrow">Circulation desk</span><h2>Hold queue</h2><p>Review claimed titles and complete the hand-off at the desk.</p></div></div>
          <section class="staff-reservations table-card" aria-labelledby="reservation-table-title">
            <div class="staff-reservations__rule"><h3 id="reservation-table-title">Reservations in queue</h3><span class="staff-reservations__window">Offers expire after 24 hours</span></div>
            <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Queue</th><th>Title</th><th>Author</th><th>Borrower</th><th>Status</th><th>Action</th></tr></thead><tbody data-reservation-body><tr><td colspan="6" class="text-center text-muted py-4">Loading reservations…</td></tr></tbody></table></div>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/scan2borrow/frontend/features/staff/pages/reservations/entry.js"></script>
  </body>
</html>
