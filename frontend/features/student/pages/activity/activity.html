<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Logs | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/borrower-activity.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/confirmation.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
  </head>
  <body class="borrower-activity student-activity" data-app-page="student-activity">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="student"></aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Activity Logs</h1>
          <div class="topbar-user"><span class="user-role" id="current-user-role">Student</span></div>
        </header>
        <div class="content borrower-activity__content" data-page="student-activity">
          <section class="borrower-activity__masthead">
            <p class="borrower-activity__eyebrow">Account timeline</p>
            <h2 id="activity-title">Activity Logs</h2>
            <p id="activity-description">Your complete account activity timeline.</p>
          </section>
          <section class="borrower-activity__panel" aria-labelledby="activity-title">
            <div class="borrower-activity__toolbar no-print">
              <span class="borrower-activity__range" id="activity-range">0 items</span>
              <div class="borrower-activity__actions">
                <div id="activity-pagination" class="borrower-activity__pagination" aria-label="Activity pages" hidden>
                  <button type="button" class="btn btn-outline-secondary btn-sm" id="activity-previous">Previous</button>
                  <button type="button" class="btn btn-outline-secondary btn-sm" id="activity-next">Next</button>
                </div>
                <button type="button" class="btn btn-primary btn-sm" id="export-activity-pdf" disabled>Export PDF</button>
              </div>
            </div>
            <div id="activity-timeline" class="activity-timeline" aria-live="polite">
              <p class="borrower-activity__state">Loading activity...</p>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/scan2borrow/frontend/features/student/pages/activity/student-activity.page.js"></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
