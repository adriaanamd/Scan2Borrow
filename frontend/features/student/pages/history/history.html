<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>My History | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/student-library-surfaces.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/student-history.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/confirmation.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body data-app-page="student-history">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="session">
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">My History</h1>
          <div class="topbar-user">
            <span class="user-role" id="current-user-role">Student</span
            ><span class="user-name" id="current-user-name"></span>
          </div>
        </header>
        <div class="content student-library-page" data-page="student-history">
          <div class="page-head">
            <div><p>Your complete borrowing record.</p></div>
          </div>
          <div class="table-card">
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Code</th>
                    <th>Book</th>
                    <th>Quantity</th>
                    <th>Borrowed</th>
                    <th>Due</th>
                    <th>Returned</th>
                    <th>Status</th>
                    <th>Fine</th>
                  </tr>
                </thead>
                <tbody id="history-body">
                  <tr>
                    <td colspan="7" class="text-center text-muted">
                      No borrowing history yet.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/scan2borrow/frontend/features/student/pages/history/student-history.page.js"></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
