<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borrowing Receipt | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <style>
      body {
        background: var(--bg);
        padding: 30px 16px;
      }
      .receipt {
        max-width: 480px;
        margin: auto;
      }
      @media print {
        .no-print {
          display: none;
        }
        body {
          background: #fff;
        }
      }
    </style>
  </head>
  <body data-app-page="student-receipt">
    <div class="receipt">
      <div class="card p-4">
        <div class="text-center mb-3">
          <div style="font-size: 42px">&#129534;</div>
          <h3 class="mb-0">Borrowing Receipt</h3>
          <div class="text-muted">Scan2Borrow Library</div>
        </div>
        <div id="receipt-content">
          <div class="alert alert-danger">
            Receipt not found. Invalid transaction code.
          </div>
        </div>
        <div class="no-print d-flex gap-2 mt-2">
          <a
            href="/scan2borrow/student/dashboard"
            class="btn btn-outline-secondary w-100"
            >Back</a
          ><button
            type="button"
            class="btn btn-primary w-100"
            id="print-receipt"
            onclick="window.print()"
          >
            Print
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/scan2borrow/frontend/features/student/pages/receipt/receipt.page.js"></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
