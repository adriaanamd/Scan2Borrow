<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Settings | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/confirmation.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
  </head>
  <body data-app-page="student-settings">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="student">
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Settings</h1>
          <div class="topbar-user">
            <span class="user-role" id="current-user-role">Student</span>
            <span class="user-name" id="current-user-name"></span>
          </div>
        </header>
        <div class="content" data-page="student-settings">
          <div class="page-head">
            <div>
              <p>View your Scan2Borrow account details.</p>
            </div>
          </div>
          <div id="student-settings-error" class="alert alert-danger" hidden>
            Unable to load your account details.
          </div>
          <div class="card">
            <div class="card-body">
              <div class="alert alert-info small">
                Student account details are managed by the library. Contact a
                librarian if any information needs to be updated.
              </div>
              <form id="student-settings-form">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="student-name">Name</label>
                    <input class="form-control" id="student-name" readonly />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="student-barcode"
                      >Student ID</label
                    >
                    <input class="form-control" id="student-barcode" readonly />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="student-course">Course</label>
                    <input class="form-control" id="student-course" readonly />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="student-year-level"
                      >Year Level</label
                    >
                    <input
                      class="form-control"
                      id="student-year-level"
                      readonly
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="student-department"
                      >Department</label
                    >
                    <input
                      class="form-control"
                      id="student-department"
                      readonly
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="student-position"
                      >Position</label
                    >
                    <input class="form-control" id="student-position" readonly />
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/scan2borrow/frontend/features/student/pages/settings/student-settings.page.js"></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
