<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Borrow Books | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/student-search.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/student-library-surfaces.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/teacher-search.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/confirmation.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  </head>
  <body class="teacher-search-page" data-app-page="teacher-search">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="teacher"></aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title" data-role-copy="catalog-topbar">Borrow Books</h1>
          <div class="topbar-user"><span class="user-role" id="current-user-role">Teacher</span><span class="user-name" id="current-user-name"></span></div>
        </header>
        <div class="content student-library-page" data-page="teacher-search">
          <div class="student-library-masthead student-search-masthead">
            <div>
              <div class="student-library-eyebrow" data-role-copy="catalog-eyebrow">Faculty library</div>
              <h2 class="mb-1" data-role-copy="catalog-title">Borrow Books</h2>
              <p class="text-muted mb-0" data-role-copy="catalog-description">Browse available books and add copies to your borrow cart.</p>
            </div>
            <div class="student-search-masthead__mark" aria-hidden="true">FAC</div>
          </div>
          <div class="student-library-panel student-search-filters mb-4">
            <form method="GET" id="searchForm" action="/scan2borrow/teacher/borrow">
              <div class="mb-3">
                <div class="input-group input-group-lg">
                  <span class="input-group-text student-search-query-icon"><strong>&#128269;</strong></span>
                  <input type="text" name="search" id="search" class="form-control" placeholder="Search by title, author, or keyword..." autofocus />
                  <button type="submit" class="btn btn-primary fw-semibold">Search</button>
                </div>
              </div>
              <div class="student-search-filters__grid">
                <div class="student-search-filter-field"><label class="form-label small fw-semibold">Category</label><select name="category_name" class="form-select form-select-sm"><option value="">All Categories</option></select></div>
                <div class="student-search-filter-field"><label class="form-label small fw-semibold">Availability</label><select name="status" class="form-select form-select-sm"><option value="">All Status</option><option value="Available">Available</option><option value="Borrowed">Borrowed</option><option value="Overdue">Overdue</option></select></div>
                <div class="student-search-filter-field"><label class="form-label small fw-semibold">Floor</label><select name="floor" class="form-select form-select-sm"><option value="">All Floors</option></select></div>
                <div class="student-search-filter-field"><label class="form-label small fw-semibold">Sort By</label><select name="sort" class="form-select form-select-sm"><option value="title">Title A-Z</option><option value="author">Author A-Z</option><option value="category_name">Category</option><option value="status">Status</option><option value="newest">Recently Added</option></select></div>
                <a id="search-clear" href="/scan2borrow/teacher/borrow" class="btn btn-outline-secondary btn-sm student-search-clear">&#10005; Clear Filters</a>
              </div>
              <div id="active-filters" class="student-search-filters__active"></div>
            </form>
          </div>
          <div class="student-library-panel student-search-results">
            <div class="student-library-panel__header student-search-results__header"><div><strong id="book-count">0</strong> <span class="text-muted" id="book-count-label">books found</span><br /><small class="text-muted" id="trending-label">&#128202; Showing faculty catalog</small></div><div class="text-muted small" id="availability-label"></div></div>
            <div id="book-results" class="student-search-results__state"><div class="student-library-state"><div class="student-library-state__icon" aria-hidden="true">&#128233;</div><strong>No books found</strong><p class="text-muted small mb-0">Try adjusting your search or filters.</p></div></div>
          </div>
          <div class="modal fade" id="borrowModal" tabindex="-1">
            <div class="modal-dialog"><div class="modal-content"><form method="POST" id="borrowFormModal">
              <input type="hidden" name="book_barcode" id="modal-book-barcode" /><input type="hidden" name="book_title" id="modal-book-title" /><input type="hidden" name="borrow" value="1" />
              <div class="modal-header text-white" style="background: var(--primary)"><h5 class="modal-title">Borrow Book</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
              <div class="modal-body"><div id="borrow-error" class="alert alert-danger" hidden></div><label class="form-label fw-semibold">Scan a copy</label><div class="input-group mb-3"><input id="bulk-scan-barcode" class="form-control" placeholder="Scan barcode to add a copy" data-scan-target="bulk-scan-barcode" /><button type="button" id="bulk-scan-add" class="btn btn-outline-secondary">Add</button></div><div class="d-flex justify-content-between mb-2"><strong>Borrow cart</strong><span><span id="bulkBorrowCount">0</span> book(s)</span></div><div id="bulkBorrowItems" class="mb-2"></div></div>
              <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary fw-semibold">Borrow Now</button></div>
            </form></div></div>
          </div>
        </div>
      </main>
    </div>
    <script src="/scan2borrow/frontend/assets/js/core/media.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/scanner.js" defer></script>
    <script type="module" src="/scan2borrow/frontend/features/student/pages/search/student-search.page.js"></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
