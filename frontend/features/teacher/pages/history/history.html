<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Borrowing History | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/student-library-surfaces.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/student-history.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/teacher-history.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/confirmation.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/app-navbar.js" defer></script>
  </head>
  <body class="teacher-history-page" data-app-page="teacher-history">
    <div class="app">
      <aside class="sidebar" data-app-navbar data-navbar-role="teacher"></aside>
      <main class="main">
        <header class="topbar"><h1 class="topbar-title" data-role-copy="history-topbar">Borrowing History</h1><div class="topbar-user"><span class="user-role" id="current-user-role">Teacher</span><span class="user-name" id="current-user-name"></span></div></header>
        <div class="content student-library-page" data-page="teacher-history">
          <div class="student-library-masthead student-history-masthead"><div><div class="student-library-eyebrow">Faculty record</div><h2 class="mb-1" data-role-copy="history-title">Borrowing History</h2><p class="text-muted mb-0" data-role-copy="history-description">Review your complete faculty borrowing record.</p></div><div class="student-history-masthead__mark" aria-hidden="true"><span></span><span></span><span></span></div></div>
          <div class="student-library-panel student-history-ledger"><div class="student-history-ledger__header"><div><div class="student-library-eyebrow">Activity archive</div><h3 class="mb-0">Borrowing activity</h3></div><span class="student-history-ledger__rule" aria-hidden="true"></span></div><div class="table-responsive student-history-ledger__table"><table class="table table-hover student-history-table"><thead><tr><th>Code</th><th>Book</th><th>Quantity</th><th>Borrowed</th><th>Due</th><th>Returned</th><th>Status</th><th>Fine</th></tr></thead><tbody id="history-body"><tr><td colspan="8" class="student-library-state teacher-history-state teacher-history-state--empty text-center text-muted">No borrowing history yet.</td></tr></tbody></table></div></div>
        </div>
      </main>
    </div>
    <script type="module" src="/scan2borrow/frontend/features/teacher/pages/history/teacher-history.page.js"></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
