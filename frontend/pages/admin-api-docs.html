<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>API Docs | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <link href="/scan2borrow/frontend/assets/css/api-docs.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">&#128218;</span><span>Scan2Borrow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="/scan2borrow/staff/dashboard"><span class="nav-icon">&#128202;</span>Dashboard</a>
          <a href="/scan2borrow/staff/books"><span class="nav-icon">&#128218;</span>Book Inventory</a>
          <a href="/scan2borrow/staff/students"><span class="nav-icon">&#128100;</span>Borrowers</a>
          <a href="/scan2borrow/staff/overdue"><span class="nav-icon">&#9888;</span>Overdue</a>
          <a href="/scan2borrow/staff/reports"><span class="nav-icon">&#128203;</span>Reports</a>
          <a href="/scan2borrow/staff/guest-requests"><span class="nav-icon">&#128203;</span>Guest Requests</a>
          <a href="/scan2borrow/admin/staff"><span class="nav-icon">&#128081;</span>Staff</a>
          <a href="/scan2borrow/admin/api-docs" class="active"><span class="nav-icon">&#128196;</span>API Docs</a>
          <a href="/scan2borrow/logout" class="nav-logout"><span class="nav-icon">&#9211;</span>Logout</a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">API Docs</h1>
          <div class="topbar-user"><span class="user-role">Administrator</span></div>
        </header>
        <div class="content" data-page="admin-api-docs">
          <div class="page-head">
            <div>
              <h2>Scan2Borrow API</h2>
              <p>Interactive endpoint reference for the modular monolith.</p>
            </div>
            <span class="badge bg-primary">OpenAPI 3.0.3</span>
          </div>
          <div class="api-docs-layout">
            <aside class="api-docs-tags" aria-label="API tags">
              <h2>Tags</h2>
              <div id="api-docs-tags" class="api-docs-tag-list"></div>
            </aside>
            <section class="api-docs-main" aria-label="API operations">
              <div class="api-docs-toolbar">
                <input id="api-docs-search" class="form-control" type="search" placeholder="Filter operations..." aria-label="Filter API operations" />
                <span id="api-docs-status" class="api-docs-status">Loading endpoints...</span>
              </div>
              <div id="api-docs-operations" class="api-docs-operations">
                <div class="api-docs-empty">Loading API documentation...</div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <script src="/scan2borrow/frontend/assets/js/pages/api-docs.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
