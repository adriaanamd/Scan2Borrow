<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borrowed Books | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">&#128218;</span><span>Scan2Borrow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="/scan2borrow/guest/dashboard"
            ><span class="nav-icon">&#127968;</span>My Dashboard</a
          ><a href="/scan2borrow/guest/profile"
            ><span class="nav-icon">&#128100;</span>Settings</a
          ><a href="/scan2borrow/guest/browse"
            ><span class="nav-icon">&#128269;</span>Browse Books</a
          ><a href="/scan2borrow/guest/borrowed" class="active"
            ><span class="nav-icon">&#128218;</span>Borrowed Books</a
          ><a href="/scan2borrow/guest/history"
            ><span class="nav-icon">&#128220;</span>Borrowing History</a
          ><a href="/scan2borrow/guest/pass"
            ><span class="nav-icon">&#127903;</span>Government ID</a
          ><a href="/scan2borrow/logout" class="nav-logout"
            ><span class="nav-icon">&#9211;</span>Logout</a
          >
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Borrowed Books</h1>
          <div class="topbar-user">
            <span class="user-role">Guest / Visitor</span>
          </div>
        </header>
        <div class="content" data-page="guest-borrowed">
          <h2 class="mb-4">Borrowed Books</h2>
          <div id="borrowed-books">
            <div class="alert alert-light border">
              You have no currently borrowed books.
            </div>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/core/media.js"
      defer
    ></script>
    <script
      src="/scan2borrow/frontend/assets/js/guest/borrowed.js"
      defer
    ></script>
  </body>
</html>
