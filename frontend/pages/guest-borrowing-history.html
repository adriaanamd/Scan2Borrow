<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Borrowing History | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">&#128218;</span><span>Scan2Borrow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="/scan2borrow/guest/dashboard"
            ><span class="nav-icon">&#127968;</span>My Dashboard</a
          ><a href="/scan2borrow/guest/profile"
            ><span class="nav-icon">&#128100;</span>Settings</a
          ><a href="/scan2borrow/guest/browse"
            ><span class="nav-icon">&#128269;</span>Browse Books</a
          ><a href="/scan2borrow/guest/borrowed"
            ><span class="nav-icon">&#128218;</span>Borrowed Books</a
          ><a href="/scan2borrow/guest/history" class="active"
            ><span class="nav-icon">&#128220;</span>Borrowing History</a
          ><a href="/scan2borrow/guest/pass"
            ><span class="nav-icon">&#127903;</span>Government ID</a
          ><a href="/scan2borrow/logout" class="nav-logout"
            ><span class="nav-icon">&#9211;</span>Logout</a
          >
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Borrowing History</h1>
          <div class="topbar-user">
            <span class="user-role">Guest / Visitor</span>
          </div>
        </header>
        <div class="content" data-page="guest-history">
          <h2>Borrowing History</h2>
          <form class="row g-2 mb-3" id="guest-history-form">
            <div class="col-md-3">
              <select name="status" class="form-select">
                <option value="">All statuses</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved / Released</option>
                <option value="returned">Returned</option>
                <option value="rejected">Rejected</option>
                <option value="overdue">Overdue</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="date" name="from" class="form-control" />
            </div>
            <div class="col-md-3">
              <input type="date" name="to" class="form-control" />
            </div>
            <div class="col-md-3">
              <button class="btn btn-success w-100">Filter</button>
            </div>
          </form>
          <div class="card">
            <div class="table-responsive">
              <table class="table mb-0">
                <thead>
                  <tr>
                    <th>Book</th>
                    <th>Borrowed</th>
                    <th>Due</th>
                    <th>Returned</th>
                    <th>Status</th>
                    <th>Receipt</th>
                  </tr>
                </thead>
                <tbody id="guest-history-body">
                  <tr>
                    <td colspan="6" class="text-center text-muted py-4">
                      No matching history.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/guest/history.js"
      defer
    ></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
