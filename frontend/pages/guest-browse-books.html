<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Browse Books | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">&#128218;</span><span>Scan2Borrow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="/scan2borrow/guest/dashboard"
            ><span class="nav-icon">&#127968;</span>My Dashboard</a
          ><a href="/scan2borrow/guest/profile"
            ><span class="nav-icon">&#128100;</span>Settings</a
          ><a href="/scan2borrow/guest/browse" class="active"
            ><span class="nav-icon">&#128269;</span>Browse Books</a
          ><a href="/scan2borrow/guest/borrowed"
            ><span class="nav-icon">&#128218;</span>Borrowed Books</a
          ><a href="/scan2borrow/guest/history"
            ><span class="nav-icon">&#128220;</span>Borrowing History</a
          ><a href="/scan2borrow/guest/pass"
            ><span class="nav-icon">&#127903;</span>Government ID</a
          ><a href="/scan2borrow/logout" class="nav-logout"
            ><span class="nav-icon">&#9211;</span>Logout</a
          >
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Browse Books</h1>
          <div class="topbar-user">
            <span class="user-role">Guest / Visitor</span>
          </div>
        </header>
        <div class="content" data-page="guest-browse">
          <h2>Browse Books</h2>
          <p class="text-muted">
            Books are released only after librarian review.
          </p>
          <form class="row g-2 mb-3" id="guest-browse-form">
            <div class="col-md-6">
              <input
                class="form-control"
                name="q"
                placeholder="Search title, author, ISBN, or category"
              />
            </div>
            <div class="col-md-4">
              <select class="form-select" name="category">
                <option value="">All categories</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-success w-100">Search</button>
            </div>
          </form>
          <div class="row g-3" id="guest-book-results">
            <p class="text-muted">No available books found.</p>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/guest/browse.js"
      defer
    ></script>
  </body>
</html>
