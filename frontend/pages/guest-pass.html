<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Government ID | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <style>
      @media print {
        .sidebar,
        .topbar,
        .no-print {
          display: none !important;
        }
        .main {
          margin-left: 0 !important;
        }
        body {
          background: #fff !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="main" style="margin-left: 0">
        <div class="content" data-page="guest-pass">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h2>Registered Government ID</h2>
              <p class="text-muted mb-0">
                Presented and verified during guest registration.
              </p>
            </div>
            <button
              class="btn btn-outline-secondary no-print"
              onclick="window.print()"
            >
              Print
            </button>
          </div>
          <div class="card shadow mx-auto" style="max-width: 560px">
            <div class="card-body p-4">
              <div
                class="d-flex justify-content-between border-bottom pb-3 mb-3"
              >
                <strong class="text-success">SCAN2BORROW</strong
                ><span>Verified Government ID</span>
              </div>
              <div class="row align-items-center">
                <div class="col-sm-7">
                  <img
                    id="visitor-photo"
                    class="rounded mb-3"
                    style="width: 100px; height: 100px; object-fit: cover"
                    alt="Visitor photo"
                  />
                  <h4 id="visitor-name"></h4>
                  <p class="mb-1">
                    <strong>ID Type:</strong> <span id="id-type"></span>
                  </p>
                  <p class="mb-1">
                    <strong>Verification:</strong>
                    <span class="badge bg-success">Verified</span>
                  </p>
                  <p class="mb-1">
                    <strong>Registered:</strong>
                    <span id="registered-date"></span>
                  </p>
                </div>
                <div class="col-sm-5 text-center">
                  <svg id="id-barcode"></svg>
                  <div
                    class="small text-muted mt-2"
                    id="id-barcode-value"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"
      defer
    ></script>
    <script src="/scan2borrow/frontend/assets/js/guest/pass.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
