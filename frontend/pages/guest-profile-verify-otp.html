<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Verify New Mobile Number | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <main class="main" style="margin-left: 0">
        <div class="content" style="max-width: 520px; margin: 60px auto">
          <h2>Verify New Mobile Number</h2>
          <p class="text-muted">
            Enter the OTP sent to your new number before saving this change.
          </p>
          <div id="form-error" class="alert alert-danger" hidden></div>
          <div id="form-success" class="alert alert-success" hidden></div>
          <div class="card">
            <div class="card-body">
              <form method="post" id="profile-otp-form">
                <input
                  class="form-control form-control-lg text-center mb-3"
                  name="otp"
                  maxlength="6"
                  pattern="[0-9]{6}"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  placeholder="000000"
                  required
                /><button class="btn btn-success w-100">
                  Verify &amp; Save
                </button>
              </form>
              <hr />
              <form method="post" class="text-center" id="resend-form">
                <button
                  class="btn btn-outline-primary btn-sm"
                  name="resend_otp"
                >
                  Resend OTP
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="/scan2borrow/frontend/assets/js/guest/otp.js" defer></script>
  </body>
</html>
