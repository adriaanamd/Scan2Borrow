<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borrowing Receipt | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <style>
      .receipt {
        max-width: 500px;
        margin: 0 auto;
      }
      @media print {
        .sidebar,
        .topbar,
        .no-print {
          display: none !important;
        }
        .main {
          margin-left: 0 !important;
        }
        body {
          background: #fff !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="main" style="margin-left: 0">
        <div class="content">
          <div class="receipt">
            <div class="card p-4">
              <div class="text-center mb-3">
                <div style="font-size: 42px">&#129534;</div>
                <h3 class="mb-0">Borrowing Receipt</h3>
                <div class="text-muted">Scan2Borrow Library</div>
              </div>
              <div id="receipt-content">
                <div class="alert alert-danger">Receipt not found.</div>
              </div>
              <div class="no-print d-flex gap-2 mt-2">
                <a
                  href="/scan2borrow/guest/history"
                  class="btn btn-outline-secondary w-100"
                  >Back</a
                ><button
                  id="print-receipt"
                  class="btn btn-success w-100"
                  onclick="window.print()"
                >
                  Print
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/guest/receipt.js"
      defer
    ></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
