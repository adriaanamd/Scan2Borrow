<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Guest Registration | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card" style="max-width: 760px">
        <div class="auth-head">
          <h3 class="mb-1">Guest Registration</h3>
          <p class="mb-0">
            Visitor information, ID verification, and SMS confirmation
          </p>
        </div>
        <div class="auth-body">
          <div id="form-error" class="alert alert-danger" hidden></div>
          <form method="POST" id="guest-reg-form" autocomplete="off">
            <input type="hidden" name="photo_data" id="photo_data" />
            <div class="text-center mb-3">
              <label class="form-label d-block fw-semibold"
                >Visitor Photo *</label
              ><video
                id="cam"
                autoplay
                playsinline
                muted
                style="
                  width: 320px;
                  max-width: 100%;
                  border-radius: 8px;
                  background: #0f172a;
                  aspect-ratio: 4/3;
                  object-fit: cover;
                "
              ></video
              ><canvas id="snap" class="d-none"></canvas
              ><img
                id="preview"
                class="d-none img-fluid rounded"
                style="width: 320px; max-width: 100%"
                alt="Captured visitor photo"
              />
              <div id="cam-msg" class="small text-muted mt-1"></div>
              <div class="mt-2">
                <button
                  type="button"
                  id="btn-start"
                  class="btn btn-outline-primary btn-sm"
                >
                  Start Camera</button
                ><button
                  type="button"
                  id="btn-capture"
                  class="btn btn-success btn-sm d-none"
                >
                  Capture</button
                ><button
                  type="button"
                  id="btn-retake"
                  class="btn btn-outline-secondary btn-sm d-none"
                >
                  Retake
                </button>
              </div>
            </div>
            <h6 class="border-bottom pb-2 mb-3">Personal Information</h6>
            <div class="row g-2 mb-3">
              <div class="col-md-4">
                <input
                  name="firstname"
                  class="form-control"
                  placeholder="First Name *"
                  required
                />
              </div>
              <div class="col-md-4">
                <input
                  name="middlename"
                  class="form-control"
                  placeholder="Middle Name"
                />
              </div>
              <div class="col-md-4">
                <input
                  name="lastname"
                  class="form-control"
                  placeholder="Last Name *"
                  required
                />
              </div>
              <div class="col-md-3">
                <input
                  name="suffix"
                  class="form-control"
                  placeholder="Suffix"
                />
              </div>
              <div class="col-md-3">
                <select name="gender" class="form-select" required>
                  <option value="">Gender *</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Prefer not to say</option>
                </select>
              </div>
              <div class="col-md-3">
                <input
                  type="date"
                  name="birthdate"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-md-3">
                <input
                  name="contact_no"
                  class="form-control"
                  placeholder="Mobile Number *"
                  required
                />
              </div>
              <div class="col-12">
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  placeholder="Email Address (optional)"
                />
              </div>
            </div>
            <h6 class="border-bottom pb-2 mb-3">Address</h6>
            <div class="row g-2 mb-3">
              <div class="col-md-3">
                <input
                  name="house_no"
                  class="form-control"
                  placeholder="House No. *"
                  required
                />
              </div>
              <div class="col-md-3">
                <input
                  name="street"
                  class="form-control"
                  placeholder="Street *"
                  required
                />
              </div>
              <div class="col-md-3">
                <input
                  name="barangay"
                  class="form-control"
                  placeholder="Barangay *"
                  required
                />
              </div>
              <div class="col-md-3">
                <input
                  name="municipality"
                  class="form-control"
                  placeholder="Municipality/City *"
                  required
                />
              </div>
              <div class="col-12">
                <input
                  name="province"
                  class="form-control"
                  placeholder="Province *"
                  required
                />
              </div>
            </div>
            <h6 class="border-bottom pb-2 mb-3">Purpose of Visit</h6>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <select
                  name="purpose"
                  id="purpose"
                  class="form-select"
                  required
                >
                  <option value="">Select purpose *</option>
                  <option>Research</option>
                  <option>Reading</option>
                  <option>Thesis</option>
                  <option>Review</option>
                  <option>Others</option>
                </select>
              </div>
              <div class="col-md-6" id="otherPurposeWrap">
                <input
                  name="purpose_other"
                  class="form-control"
                  placeholder="Specify other purpose"
                />
              </div>
            </div>
            <h6 class="border-bottom pb-2 mb-3">
              Government-Issued ID Verification
            </h6>
            <p class="small text-muted">
              Present a valid ID. Its barcode can be scanned or entered
              manually.
            </p>
            <div class="row g-2">
              <div class="col-md-6">
                <select name="id_type" class="form-select" required>
                  <option value="">ID Type *</option>
                  <option>National ID</option>
                  <option>Driver's License</option>
                  <option>Passport</option>
                  <option>UMID</option>
                  <option>PRC ID</option>
                  <option>Postal ID</option>
                  <option>PhilHealth ID</option>
                  <option>Voter's ID</option>
                  <option>Senior Citizen ID</option>
                  <option>Other Government-Issued ID</option>
                </select>
              </div>
              <div class="col-md-6">
                <input
                  name="id_barcode"
                  class="form-control"
                  placeholder="ID Barcode Number *"
                  required
                />
              </div>
            </div>
            <button
              type="submit"
              class="btn btn-success w-100 mt-4 py-2 fw-semibold"
            >
              Send SMS OTP
            </button>
          </form>
          <hr />
          <a
            href="/scan2borrow/register"
            class="text-decoration-none d-block text-center"
            >â† Back to registration options</a
          >
        </div>
      </div>
    </div>
    <script src="frontend/assets/js/guest/registration.js" defer></script>
  </body>
</html>
