<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Return a Book | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <main class="main" style="margin-left: 0">
        <div class="content" data-page="guest-return">
          <h2>Return a Book</h2>
          <p class="text-muted">
            Scan the book, then take a clear photo while holding the returned
            book.
          </p>
          <div id="form-error" class="alert alert-danger" hidden></div>
          <div id="form-success" class="alert alert-success" hidden></div>
          <div class="card">
            <div class="card-body">
              <form method="post" id="returnForm">
                <input
                  class="form-control mb-3"
                  name="book_barcode"
                  autofocus
                  placeholder="Scan or enter book barcode"
                /><input type="hidden" id="return_photo" name="return_photo" />
                <div class="position-relative text-center">
                  <video
                    id="cam"
                    autoplay
                    playsinline
                    muted
                    style="
                      width: 420px;
                      max-width: 100%;
                      background: #111;
                      border-radius: 10px;
                    "
                  ></video>
                  <div
                    class="position-absolute top-50 start-50 translate-middle border border-3 border-warning rounded"
                    style="
                      width: 55%;
                      height: 34%;
                      pointer-events: none;
                      animation: pulse 1.5s infinite;
                    "
                  ></div>
                  <p class="small">
                    Hold the returned book below your chest. Keep your face and
                    the book cover visible.
                  </p>
                  <canvas id="snap" class="d-none"></canvas
                  ><img
                    id="preview"
                    class="d-none img-fluid rounded"
                    style="max-width: 420px"
                    alt="Return verification preview"
                  />
                </div>
                <button
                  type="button"
                  id="start"
                  class="btn btn-outline-primary"
                >
                  Start Camera</button
                ><button
                  type="button"
                  id="capture"
                  class="btn btn-success d-none"
                >
                  Capture</button
                ><button
                  type="button"
                  id="retake"
                  class="btn btn-outline-secondary d-none"
                >
                  Retake</button
                ><button class="btn btn-success float-end">
                  Submit Return
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/guest/camera-capture.js"
      defer
    ></script>
    <script
      src="/scan2borrow/frontend/assets/js/guest/return-book.js"
      defer
    ></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
