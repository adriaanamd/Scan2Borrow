<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Verify Guest OTP | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card auth-split">
        <aside class="auth-brand-panel" aria-label="Scan2Borrow brand">
          <img
            class="auth-brand-logo"
            src="/scan2borrow/public/logo.png"
            alt="Binalbagan Catholic College seal"
          />
          <div class="auth-brand-wordmark">Scan2Borrow</div>
          <p>School Library</p>
        </aside>
        <main class="auth-panel">
        <div class="auth-head">
          <div class="auth-kicker">Visitor access</div>
          <h3>Guest SMS Verification</h3>
          <p class="mb-0">Enter the OTP sent to your mobile number.</p>
        </div>
        <div class="auth-body">
          <div id="form-error" class="alert alert-danger" hidden></div>
          <div id="form-success" class="alert alert-success" hidden></div>
          <form method="POST" id="guest-otp-form">
            <input
              name="otp"
              class="form-control form-control-lg text-center mb-3"
              maxlength="6"
              pattern="[0-9]{6}"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="000000"
              required
            /><button class="btn btn-success w-100">
              Verify OTP &amp; Register
            </button>
          </form>
          <hr />
          <form method="POST" class="text-center" id="resend-form">
            <button name="resend_otp" class="btn btn-outline-primary btn-sm">
              Resend OTP
            </button>
          </form>
          <p class="text-center small mt-3">
            OTP expires in <span id="expires-in">5</span> minute(s).
          </p>
        </div>
        </main>
      </div>
    </div>
    <script src="/scan2borrow/frontend/assets/js/guest/otp.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
