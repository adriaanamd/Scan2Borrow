<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Student Login | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-head">
          <div class="logo">&#128218;</div>
          <h2 class="mb-1">Scan2Borrow</h2>
          <p class="mb-0">School Library</p>
        </div>
        <div class="auth-body">
          <div id="login-error" class="alert alert-danger" hidden></div>
          <form method="POST" autocomplete="off" id="borrower-login-form">
            <label class="form-label fw-semibold">Scan ID Barcode</label>
            <input
              type="text"
              name="barcode"
              id="barcode"
              class="form-control form-control-lg mb-2"
              placeholder="Scan your ID"
              autofocus
              required
            />
            <p class="scan-hint mb-3">
              Hold your ID under the barcode scanner.
            </p>
            <button
              type="submit"
              name="login"
              class="btn btn-accent w-100 py-2 fw-semibold"
            >
              Login
            </button>
          </form>

          <div class="modal fade" id="studentRegisterModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-centered">
              <div class="modal-content">
                <form
                  method="POST"
                  action="/scan2borrow/register"
                  id="studentRegForm"
                  autocomplete="off"
                >
                  <input type="hidden" name="role" value="student" />
                  <div class="modal-header">
                    <h5 class="modal-title">Student Registration</h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <div class="row g-2">
                      <div class="col-12">
                        <input
                          type="text"
                          name="barcode"
                          class="form-control"
                          placeholder="Student Barcode ID"
                          required
                        />
                      </div>
                      <div class="col-md-4">
                        <input
                          type="text"
                          name="firstname"
                          class="form-control"
                          placeholder="First Name"
                          required
                        />
                      </div>
                      <div class="col-md-4">
                        <input
                          type="text"
                          name="middlename"
                          class="form-control"
                          placeholder="Middle Name"
                        />
                      </div>
                      <div class="col-md-4">
                        <input
                          type="text"
                          name="lastname"
                          class="form-control"
                          placeholder="Last Name"
                          required
                        />
                      </div>
                      <div class="col-md-6">
                        <input
                          type="text"
                          name="course"
                          class="form-control"
                          placeholder="Course"
                          required
                        />
                      </div>
                      <div class="col-md-6">
                        <input
                          type="text"
                          name="year_level"
                          class="form-control"
                          placeholder="Year Level"
                          required
                        />
                      </div>
                      <div class="col-md-6">
                        <input
                          type="email"
                          name="email"
                          class="form-control"
                          placeholder="Email Address"
                        />
                      </div>
                      <div class="col-md-6">
                        <input
                          type="text"
                          name="contact_no"
                          class="form-control"
                          placeholder="Contact Number"
                          required
                        />
                      </div>
                      <div class="col-12 text-center mt-2">
                        <label class="form-label d-block fw-semibold"
                          >Capture ID Photo</label
                        >
                        <video
                          id="modal_cam"
                          autoplay
                          playsinline
                          muted
                          style="
                            width: 320px;
                            height: 240px;
                            border-radius: 8px;
                            background: #0f172a;
                            object-fit: cover;
                          "
                        ></video>
                        <canvas id="modal_snap" class="d-none"></canvas>
                        <img
                          id="modal_preview"
                          class="d-none img-fluid rounded"
                          style="width: 320px"
                          alt="Captured photo"
                        />
                        <input
                          type="hidden"
                          name="photo_data"
                          id="modal_photo_data"
                        />
                        <div class="mt-2">
                          <button
                            type="button"
                            id="modal_start"
                            class="btn btn-outline-primary btn-sm"
                          >
                            Start Camera
                          </button>
                          <button
                            type="button"
                            id="modal_capture"
                            class="btn btn-accent btn-sm d-none"
                          >
                            Capture
                          </button>
                          <button
                            type="button"
                            id="modal_retake"
                            class="btn btn-outline-secondary btn-sm d-none"
                          >
                            Retake
                          </button>
                        </div>
                      </div>
                    </div>
                    <div
                      id="student-register-error"
                      class="alert alert-danger mt-3"
                      hidden
                    ></div>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-light"
                      data-bs-dismiss="modal"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      name="register"
                      class="btn btn-primary"
                    >
                      Register Student
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <div class="modal fade" id="teacherRegisterModal" tabindex="-1">
            <div class="modal-dialog modal-md modal-dialog-centered">
              <div class="modal-content">
                <form
                  method="POST"
                  action="/scan2borrow/register"
                  id="teacherRegForm"
                  autocomplete="off"
                >
                  <input type="hidden" name="role" value="teacher" />
                  <div class="modal-header">
                    <h5 class="modal-title">Teacher Registration</h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <div class="row g-2">
                      <div class="col-12">
                        <input
                          type="text"
                          name="barcode"
                          class="form-control"
                          placeholder="Teacher Barcode ID"
                          required
                        />
                      </div>
                      <div class="col-md-4">
                        <input
                          type="text"
                          name="firstname"
                          class="form-control"
                          placeholder="First Name"
                          required
                        />
                      </div>
                      <div class="col-md-4">
                        <input
                          type="text"
                          name="middlename"
                          class="form-control"
                          placeholder="Middle Name"
                        />
                      </div>
                      <div class="col-md-4">
                        <input
                          type="text"
                          name="lastname"
                          class="form-control"
                          placeholder="Last Name"
                          required
                        />
                      </div>
                      <div class="col-md-6">
                        <input
                          type="text"
                          name="department"
                          class="form-control"
                          placeholder="Department"
                          required
                        />
                      </div>
                      <div class="col-md-6">
                        <select name="position" class="form-select" required>
                          <option value="">Select Position</option>
                          <option value="College Teacher">
                            College Teacher
                          </option>
                          <option value="Part-Time Teacher">
                            Part-Time Teacher
                          </option>
                          <option value="Academic Dean">Academic Dean</option>
                          <option value="College Dean">College Dean</option>
                          <option value="Elementary Teacher">
                            Elementary Teacher
                          </option>
                          <option value="Senior High Teacher">
                            Senior High Teacher
                          </option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <input
                          type="email"
                          name="email"
                          class="form-control"
                          placeholder="Email Address"
                        />
                      </div>
                      <div class="col-md-6">
                        <input
                          type="text"
                          name="contact_no"
                          class="form-control"
                          placeholder="Contact Number"
                          required
                        />
                      </div>
                    </div>
                    <div
                      id="teacher-register-error"
                      class="alert alert-danger mt-3"
                      hidden
                    ></div>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-light"
                      data-bs-dismiss="modal"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      name="register"
                      class="btn btn-primary"
                    >
                      Register Teacher
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <hr />
          <p class="text-center mb-2">First time using Scan2Borrow?</p>
          <a href="/scan2borrow/register" class="btn btn-primary w-100 mb-3"
            >Register New Borrower</a
          >
          <div class="text-center">
            <a href="/scan2borrow/staff/login" class="text-muted small"
              >&#128274; Staff / Librarian Login</a
            >
          </div>
        </div>
      </div>
    </div>
    <script src="/scan2borrow/frontend/assets/js/pages/auth.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
