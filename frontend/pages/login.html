<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Student Login | Scan2Borrow</title>
    <link rel="icon" type="image/png" href="/scan2borrow/public/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <script src="/scan2borrow/frontend/assets/js/core/auth-brand.js" defer></script>
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card auth-split">
        <aside class="auth-brand-panel" data-auth-brand aria-label="Scan2Borrow brand"></aside>
        <main class="auth-panel">
        <div class="auth-head">
          <div class="auth-kicker">Borrower access</div>
          <h2 class="mb-1">Login</h2>
          <p class="mb-0">Scan your school ID to continue.</p>
        </div>
        <div class="auth-body">
          <div id="login-error" class="alert alert-danger" hidden></div>
          <form method="POST" autocomplete="off" id="borrower-login-form">
            <label class="form-label fw-semibold">Scan ID Barcode</label>
            <input
              type="text"
              name="barcode"
              id="barcode"
              class="form-control form-control-lg mb-2"
              placeholder="Scan your ID"
              autofocus
              required
            />
            <p class="scan-hint mb-3">
              Hold your ID under the barcode scanner.
            </p>
            <button
              type="submit"
              name="login"
              class="btn btn-accent w-100 py-2 fw-semibold"
            >
              Login
            </button>
          </form>

          <hr />
          <p class="text-center mb-2">First time using Scan2Borrow?</p>
          <a href="/scan2borrow/register" class="btn btn-primary w-100 mb-3"
            >Register New Borrower</a
          >
          <div class="text-center">
            <a href="/scan2borrow/staff/login" class="text-muted small"
              >&#128274; Staff / Librarian Login</a
            >
          </div>
        </div>
        </main>
      </div>
    </div>
    <script src="/scan2borrow/frontend/assets/js/pages/auth.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
