<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Register | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card" style="max-width: 560px">
        <div class="auth-head">
          <h3 class="mb-1">Library Borrower Registration</h3>
        </div>
        <div class="auth-body">
          <div id="form-error" class="alert alert-danger" hidden></div>
          <form method="post" id="registration-form">
            <input type="hidden" name="role" id="role" />
            <div class="row g-2">
              <div class="col-12">
                <input
                  type="text"
                  name="barcode"
                  class="form-control"
                  placeholder="Student or Teacher Barcode ID"
                  required
                />
              </div>
              <div class="col-md-4">
                <input
                  type="text"
                  name="firstname"
                  class="form-control"
                  placeholder="First Name"
                  required
                />
              </div>
              <div class="col-md-4">
                <input
                  type="text"
                  name="middlename"
                  class="form-control"
                  placeholder="Middle Name"
                />
              </div>
              <div class="col-md-4">
                <input
                  type="text"
                  name="lastname"
                  class="form-control"
                  placeholder="Last Name"
                  required
                />
              </div>
              <div class="col-md-6">
                <input
                  type="text"
                  name="department"
                  class="form-control"
                  placeholder="Department"
                />
              </div>
              <div class="col-md-6">
                <input
                  type="text"
                  name="position"
                  class="form-control"
                  placeholder="Position"
                />
              </div>
              <div class="col-md-6">
                <input
                  type="text"
                  name="course"
                  class="form-control"
                  placeholder="Course"
                />
              </div>
              <div class="col-md-6">
                <input
                  type="text"
                  name="year_level"
                  class="form-control"
                  placeholder="Year Level"
                />
              </div>
              <div class="col-md-6">
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  placeholder="Email Address"
                />
              </div>
              <div class="col-md-6">
                <input
                  type="text"
                  name="contact_no"
                  class="form-control"
                  placeholder="Contact Number"
                  required
                />
              </div>
              <div class="col-12 text-center mt-2">
                <label class="form-label d-block fw-semibold"
                  >Capture ID Photo</label
                ><video
                  id="modal_cam"
                  autoplay
                  playsinline
                  muted
                  style="
                    width: 320px;
                    height: 240px;
                    border-radius: 8px;
                    background: #0f172a;
                    object-fit: cover;
                  "
                ></video
                ><canvas id="modal_snap" class="d-none"></canvas
                ><img
                  id="modal_preview"
                  class="d-none img-fluid rounded"
                  style="width: 320px"
                  alt="Captured photo"
                /><input
                  type="hidden"
                  name="photo_data"
                  id="modal_photo_data"
                />
                <div class="mt-2">
                  <button
                    type="button"
                    id="modal_start"
                    class="btn btn-outline-primary btn-sm"
                  >
                    Start Camera</button
                  ><button
                    type="button"
                    id="modal_capture"
                    class="btn btn-accent btn-sm d-none"
                  >
                    Capture</button
                  ><button
                    type="button"
                    id="modal_retake"
                    class="btn btn-outline-secondary btn-sm d-none"
                  >
                    Retake
                  </button>
                </div>
              </div>
            </div>
            <button
              type="submit"
              name="register"
              class="btn btn-primary w-100 mt-3"
            >
              Register
            </button>
          </form>
          <div class="text-center mt-3">
            <a href="/scan2borrow/login">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
    <script src="frontend/assets/js/pages/registration.js" defer></script>
  </body>
</html>
