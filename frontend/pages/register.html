<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Register | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card" style="max-width: 560px">
        <div class="auth-head">
          <h3 class="mb-1">Library Borrower Registration</h3>
        </div>
        <div class="auth-body">
          <div id="form-error" class="alert alert-danger" hidden></div>
          <form method="POST" id="reg-form" autocomplete="off">
            <input type="hidden" name="photo_data" id="photo_data" />
            <section class="registration-role-picker" aria-labelledby="registration-role-title">
              <div class="registration-role-kicker">Account type</div>
              <h4 id="registration-role-title">Register as</h4>
              <p class="registration-role-help">Choose the account type you want to create.</p>
              <div class="registration-role-grid">
                <button type="button" class="registration-role-choice" id="chooseStudent" data-role="student" aria-pressed="false">
                  <span class="registration-role-mark" aria-hidden="true"></span>
                  <span><strong>Student</strong><small>For currently enrolled students</small></span>
                </button>
                <button type="button" class="registration-role-choice" id="chooseTeacher" data-role="teacher" aria-pressed="false">
                  <span class="registration-role-mark" aria-hidden="true"></span>
                  <span><strong>Teacher</strong><small>For teaching staff</small></span>
                </button>
                <button type="button" class="registration-role-choice" id="chooseGuest" data-role="guest" aria-pressed="false">
                  <span class="registration-role-mark" aria-hidden="true"></span>
                  <span><strong>Guest / Visitor</strong><small>Continue to guest registration</small></span>
                </button>
              </div>
              <div class="registration-role-current">
                <span>Selected role</span>
                <strong id="selected-role-label">Select a role</strong>
              </div>
            </section>
            <select name="role" id="role_select" class="registration-role-native-select" aria-label="Registration role" required>
              <option value="">Select Role</option>
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
            </select>
            <div class="text-center mb-3">
              <label class="form-label d-block fw-semibold">ID Photo</label>
              <div class="photo-capture mx-auto" style="max-width: 260px">
                <video
                  id="cam"
                  autoplay
                  playsinline
                  muted
                  style="
                    width: 100%;
                    border-radius: 12px;
                    background: #0f172a;
                    aspect-ratio: 4/3;
                    object-fit: cover;
                  "
                ></video>
                <canvas id="snap" class="d-none"></canvas>
                <img
                  id="preview"
                  class="d-none img-fluid rounded"
                  style="aspect-ratio: 4/3; object-fit: cover; width: 100%"
                  alt="Captured photo"
                />
                <div id="cam-msg" class="text-muted small mt-1"></div>
                <div class="d-flex gap-2 mt-2 justify-content-center">
                  <button
                    type="button"
                    id="btn-start"
                    class="btn btn-outline-primary btn-sm"
                  >
                    Start Camera
                  </button>
                  <button
                    type="button"
                    id="btn-capture"
                    class="btn btn-accent btn-sm d-none"
                  >
                    Capture
                  </button>
                  <button
                    type="button"
                    id="btn-retake"
                    class="btn btn-outline-secondary btn-sm d-none"
                  >
                    Retake
                  </button>
                </div>
              </div>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <input
                  type="text"
                  name="barcode"
                  class="form-control"
                  placeholder="School ID Number"
                  required
                />
              </div>
              <div class="col-md-4">
                <input
                  type="text"
                  name="firstname"
                  class="form-control"
                  placeholder="First Name"
                  required
                />
              </div>
              <div class="col-md-4">
                <input
                  type="text"
                  name="middlename"
                  class="form-control"
                  placeholder="Middle Name"
                />
              </div>
              <div class="col-md-4">
                <input
                  type="text"
                  name="lastname"
                  class="form-control"
                  placeholder="Last Name"
                  required
                />
              </div>
              <div class="col-md-6 student-only">
                <select name="course" class="form-select">
                  <option value="">Select Course</option>
                  <option value="Bachelor of Science in Information Technology">
                    Bachelor of Science in Information Technology
                  </option>
                  <option value="Bachelor of Science in Business Management">
                    Bachelor of Science in Business Management
                  </option>
                  <option value="Bachelor of Science in Education">
                    Bachelor of Science in Education
                  </option>
                  <option value="Bachelor of Science in Accountancy">
                    Bachelor of Science in Accountancy
                  </option>
                </select>
              </div>
              <div class="col-md-6 student-only">
                <select name="year_level" class="form-select">
                  <option value="">Select Year</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </div>
              <div class="col-md-6">
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  placeholder="Email Address"
                />
              </div>
              <div class="col-md-6">
                <input
                  type="text"
                  name="contact_no"
                  class="form-control"
                  placeholder="Contact Number"
                />
              </div>
              <div class="col-md-6 teacher-only d-none">
                <select name="department" class="form-select">
                  <option value="">Select Department</option>
                  <option value="CABAIT">CABAIT</option>
                  <option value="EDUCATION">EDUCATION</option>
                </select>
              </div>
              <div class="col-md-6 teacher-only d-none">
                <select name="position" class="form-select">
                  <option value="">Select Position</option>
                  <option value="College Teacher">College Teacher</option>
                  <option value="Part-Time Teacher">Part-Time Teacher</option>
                  <option value="Academic Dean">Academic Dean</option>
                  <option value="College Dean">College Dean</option>
                  <option value="Elementary Teacher">Elementary Teacher</option>
                  <option value="Senior High Teacher">
                    Senior High Teacher
                  </option>
                </select>
              </div>
            </div>
            <button
              type="submit"
              name="register"
              class="btn btn-accent w-100 mt-3 py-2 fw-semibold"
            >
              Register Account
            </button>
          </form>
          <hr />
          <a
            href="/scan2borrow/login"
            class="text-decoration-none d-block text-center"
            >Already registered? Go to Login</a
          >
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script
      src="/scan2borrow/frontend/assets/js/pages/registration.js"
      defer
    ></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
