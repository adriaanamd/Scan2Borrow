<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Staff Login | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-head">
          <div class="logo">&#128274;</div>
          <h2 class="mb-1">Staff Portal</h2>
          <p class="mb-0">Librarian / Administrator Login</p>
        </div>
        <div class="auth-body">
          <div id="login-error" class="alert alert-danger" hidden></div>
          <form method="POST" id="staff-login-form" autocomplete="off">
            <label class="form-label fw-semibold">Staff ID Barcode</label
            ><input
              type="text"
              name="barcode"
              class="form-control mb-3"
              placeholder="Scan or enter staff ID"
              autofocus
              required
            /><label class="form-label fw-semibold">Password</label
            ><input
              type="password"
              name="password"
              class="form-control mb-3"
              placeholder="Enter your password"
              required
            /><button
              type="submit"
              name="login"
              class="btn btn-gradient w-100 py-2 fw-semibold"
            >
              Login
            </button>
          </form>
          <hr />
          <div class="text-center">
            <a href="/scan2borrow/login" class="text-muted small"
              >&#8592; Back to Student Login</a
            >
          </div>
        </div>
      </div>
    </div>
    <script src="/scan2borrow/frontend/assets/js/pages/auth.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
