<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Send Notification | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">&#128218;</span><span>Scan2Borrow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="/scan2borrow/staff/dashboard"
            ><span class="nav-icon">&#128202;</span>Dashboard</a
          >
          <a href="/scan2borrow/staff/books"
            ><span class="nav-icon">&#128218;</span>Book Inventory</a
          >
          <a href="/scan2borrow/staff/students"
            ><span class="nav-icon">&#128100;</span>Borrowers</a
          >
          <a href="/scan2borrow/staff/overdue"
            ><span class="nav-icon">&#9888;</span>Overdue</a
          >
          <a href="/scan2borrow/staff/reports"
            ><span class="nav-icon">&#128203;</span>Reports</a
          >
          <a href="/scan2borrow/staff/guest-requests"
            ><span class="nav-icon">&#128203;</span>Guest Requests</a
          >
          <a href="/scan2borrow/admin/staff"
            ><span class="nav-icon">&#128081;</span>Staff</a
          >
          <a href="/scan2borrow/logout" class="nav-logout"
            ><span class="nav-icon">&#9211;</span>Logout</a
          >
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Send Notification</h1>
          <div class="topbar-user"><span class="user-role">Staff</span></div>
        </header>
        <div class="content" data-page="staff-notify">
          <a
            id="notify-back"
            href="/scan2borrow/staff/students"
            class="btn btn-outline-secondary btn-sm mb-3"
            >&larr; Back to Borrowers</a
          >
          <div class="table-card" style="max-width: 720px">
            <h5>Email Notification</h5>
            <div id="notify-email-alert"></div>
            <p class="mb-1">
              <strong>Borrower:</strong>
              <span id="notify-name">Loading...</span>
            </p>
            <p class="mb-1">
              <strong>Email:</strong> <span id="notify-email"></span>
            </p>
            <p class="mb-1">
              <strong>Contact Number:</strong> <span id="notify-contact"></span>
            </p>
            <p class="mb-3">
              <strong>Active loans:</strong> <span id="notify-loans">0</span>
            </p>
            <button type="button" id="send-email" class="btn btn-accent">
              &#128231; Send Email Notification
            </button>
            <hr class="my-4" />
            <h5>SMS Notification</h5>
            <div id="notify-sms-alert"></div>
            <button type="button" id="send-sms" class="btn btn-success">
              &#128242; Send SMS Notification
            </button>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/core/media.js"
      defer
    ></script>
    <script src="/scan2borrow/frontend/assets/js/pages/staff.js" defer></script>
  </body>
</html>
