<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Borrowers | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">&#128218;</span><span>Scan2Borrow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="/scan2borrow/staff/dashboard"
            ><span class="nav-icon">&#128202;</span>Dashboard</a
          >
          <a href="/scan2borrow/staff/books"
            ><span class="nav-icon">&#128218;</span>Book Inventory</a
          >
          <a href="/scan2borrow/staff/students"
            ><span class="nav-icon">&#128100;</span>Borrowers</a
          >
          <a href="/scan2borrow/staff/overdue"
            ><span class="nav-icon">&#9888;</span>Overdue</a
          >
          <a href="/scan2borrow/staff/reports"
            ><span class="nav-icon">&#128203;</span>Reports</a
          >
          <a href="/scan2borrow/staff/guest-requests"
            ><span class="nav-icon">&#128203;</span>Guest Requests</a
          >
          <a href="/scan2borrow/admin/staff"
            ><span class="nav-icon">&#128081;</span>Staff</a
          >
          <a href="/scan2borrow/logout" class="nav-logout"
            ><span class="nav-icon">&#9211;</span>Logout</a
          >
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Borrowers</h1>
          <div class="topbar-user"><span class="user-role">Staff</span></div>
        </header>
        <div class="content" data-page="staff-students">
          <div class="page-head">
            <div>
              <p>Manage students, and monitor their borrowing activity.</p>
            </div>
          </div>

          <div class="table-card">
            <form method="GET" class="mb-3" style="max-width: 380px">
              <div class="input-group">
                <input
                  type="text"
                  name="search"
                  class="form-control"
                  placeholder="Search by name, ID or course..."
                  value=""
                />
                <button class="btn btn-primary">Search</button>

                <a
                  href="/scan2borrow/staff/students"
                  class="btn btn-outline-secondary"
                  >Clear</a
                >
              </div>
            </form>

            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>ID Barcode</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Course</th>
                    <th>Year</th>
                    <th>Active</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="10" class="text-center text-muted">
                      No borrowers found.
                    </td>
                  </tr>

                  <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td>
                      <span class="badge bg-primary"></span>

                      <span class="badge bg-danger"> overdue</span>
                    </td>
                    <td></td>
                    <td class="text-nowrap">
                      <a
                        href="/scan2borrow/staff/borrower?id="
                        class="btn btn-primary btn-sm"
                        >View</a
                      >
                      <a
                        href="/scan2borrow/staff/notify?id="
                        class="btn btn-warning btn-sm"
                        >Notify</a
                      >
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="/scan2borrow/frontend/assets/js/pages/staff.js" defer></script>
  </body>
</html>
