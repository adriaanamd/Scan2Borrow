<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>My History | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">&#128218;</span><span>Scan2Borrow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="/scan2borrow/settings"
            ><span class="nav-icon">&#9881;</span>Settings</a
          ><a href="/scan2borrow/student/dashboard"
            ><span class="nav-icon">&#127968;</span>My Dashboard</a
          ><a href="/scan2borrow/student/search"
            ><span class="nav-icon">&#128269;</span>Search Books</a
          ><a href="/scan2borrow/student/history" class="active"
            ><span class="nav-icon">&#128220;</span>My History</a
          ><a href="/scan2borrow/logout" class="nav-logout"
            ><span class="nav-icon">&#9211;</span>Logout</a
          >
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">My History</h1>
          <div class="topbar-user">
            <span class="user-role" id="current-user-role">Student</span
            ><span class="user-name" id="current-user-name"></span>
          </div>
        </header>
        <div class="content" data-page="student-history">
          <div class="page-head">
            <div><p>Your complete borrowing record.</p></div>
          </div>
          <div class="table-card">
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Code</th>
                    <th>Book</th>
                    <th>Borrowed</th>
                    <th>Due</th>
                    <th>Returned</th>
                    <th>Status</th>
                    <th>Fine</th>
                  </tr>
                </thead>
                <tbody id="history-body">
                  <tr>
                    <td colspan="7" class="text-center text-muted">
                      No borrowing history yet.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script
      src="/scan2borrow/frontend/assets/js/pages/student-history.js"
      defer
    ></script>
  </body>
</html>
