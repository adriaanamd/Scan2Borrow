<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Search Books | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="frontend/assets/css/style.css" rel="stylesheet" />
    <link href="frontend/assets/css/student-search.css" rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">&#128218;</span><span>Scan2Borrow</span>
        </div>
        <nav class="sidebar-nav">
          <a href="/scan2borrow/settings"
            ><span class="nav-icon">&#9881;</span>Settings</a
          >
          <a href="/scan2borrow/student/dashboard"
            ><span class="nav-icon">&#127968;</span>My Dashboard</a
          >
          <a href="/scan2borrow/student/search" class="active"
            ><span class="nav-icon">&#128269;</span>Search Books</a
          >
          <a href="/scan2borrow/student/history"
            ><span class="nav-icon">&#128220;</span>My History</a
          >
          <a href="/scan2borrow/logout" class="nav-logout"
            ><span class="nav-icon">&#9211;</span>Logout</a
          >
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 class="topbar-title">Search Books</h1>
          <div class="topbar-user">
            <span class="user-role" id="current-user-role">Student</span
            ><span class="user-name" id="current-user-name"></span>
          </div>
        </header>
        <div class="content" data-page="student-search">
          <div class="page-head">
            <div>
              <h3 class="mb-1">Book Catalog</h3>
              <p class="text-muted mb-0">
                Search and discover available books.
              </p>
            </div>
          </div>
          <div class="soft-card mb-4">
            <form
              method="GET"
              id="searchForm"
              action="/scan2borrow/student/search"
            >
              <div class="mb-3">
                <div class="input-group input-group-lg">
                  <span
                    class="input-group-text"
                    style="background: none; border-right: none"
                    ><strong>ðŸ”</strong></span
                  ><input
                    type="text"
                    name="search"
                    id="search"
                    class="form-control"
                    placeholder="Search by title, author, or keyword..."
                    autofocus
                  /><button type="submit" class="btn btn-primary fw-semibold">
                    Search
                  </button>
                </div>
              </div>
              <div
                style="
                  display: flex;
                  flex-wrap: wrap;
                  gap: 12px;
                  align-items: flex-end;
                "
              >
                <div style="flex: 1; min-width: 150px">
                  <label class="form-label small fw-semibold">Category</label
                  ><select
                    name="category_name"
                    class="form-select form-select-sm"
                  >
                    <option value="">All Categories</option>
                  </select>
                </div>
                <div style="flex: 1; min-width: 150px">
                  <label class="form-label small fw-semibold"
                    >Availability</label
                  ><select name="status" class="form-select form-select-sm">
                    <option value="">All Status</option>
                    <option value="Available">Available</option>
                    <option value="Borrowed">Borrowed</option>
                    <option value="Overdue">Overdue</option>
                  </select>
                </div>
                <div style="flex: 1; min-width: 150px">
                  <label class="form-label small fw-semibold">Floor</label
                  ><select name="floor" class="form-select form-select-sm">
                    <option value="">All Floors</option>
                  </select>
                </div>
                <div style="flex: 1; min-width: 150px">
                  <label class="form-label small fw-semibold">Sort By</label
                  ><select name="sort" class="form-select form-select-sm">
                    <option value="title">Title A-Z</option>
                    <option value="author">Author A-Z</option>
                    <option value="category_name">Category</option>
                    <option value="status">Status</option>
                    <option value="newest">Recently Added</option>
                  </select>
                </div>
                <a
                  href="/scan2borrow/student/search"
                  class="btn btn-outline-secondary btn-sm"
                  style="align-self: flex-end"
                  >âœ• Clear Filters</a
                >
              </div>
              <div
                id="active-filters"
                style="
                  margin-top: 12px;
                  display: flex;
                  flex-wrap: wrap;
                  gap: 8px;
                "
              ></div>
            </form>
          </div>
          <div class="soft-card">
            <div
              class="d-flex justify-content-between align-items-center mb-3"
              style="border-bottom: 1px solid #e9ecef; padding-bottom: 12px"
            >
              <div>
                <strong id="book-count">0</strong>
                <span class="text-muted" id="book-count-label">books found</span
                ><br /><small class="text-muted" id="trending-label"
                  >ðŸ“Š Showing trending books</small
                >
              </div>
              <div class="text-muted small" id="availability-label"></div>
            </div>
            <div id="book-results">
              <div class="text-center py-5">
                <div style="font-size: 48px; margin-bottom: 12px">ðŸ“­</div>
                <strong>No books found</strong>
                <p class="text-muted small">
                  Try adjusting your search or filters.
                </p>
              </div>
            </div>
          </div>
          <div class="modal fade" id="borrowModal" tabindex="-1">
            <div class="modal-dialog">
              <div class="modal-content">
                <form method="POST" id="borrowFormModal">
                  <input
                    type="hidden"
                    name="book_barcode"
                    id="modal-book-barcode"
                  /><input type="hidden" name="borrow" value="1" />
                  <div
                    class="modal-header text-white"
                    style="background: var(--primary)"
                  >
                    <h5 class="modal-title">Borrow Book</h5>
                    <button
                      type="button"
                      class="btn-close btn-close-white"
                      data-bs-dismiss="modal"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <div class="mb-3">
                      <label class="form-label fw-semibold">Book Title</label>
                      <p
                        id="modal-book-title"
                        style="font-size: 14px; color: #666"
                      ></p>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-light"
                      data-bs-dismiss="modal"
                    >
                      Cancel</button
                    ><button type="submit" class="btn btn-primary fw-semibold">
                      Borrow Now
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="frontend/assets/js/pages/student-search.js" defer></script>
  </body>
</html>
