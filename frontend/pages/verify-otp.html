<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Verify OTP | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/scan2borrow/frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card" style="max-width: 480px">
        <div class="auth-head">
          <h3 class="mb-1">OTP Verification</h3>
          <p class="text-muted mb-0">
            Enter the 6-digit code sent to your phone
          </p>
        </div>
        <div class="auth-body">
          <div id="form-error" class="alert alert-danger" hidden></div>
          <div id="form-success" class="alert alert-success" hidden></div>
          <form method="POST" id="otpForm">
            <div class="text-center mb-4">
              <div class="otp-icon mb-3">&#128274;</div>
              <p class="text-muted small">
                We've sent a 6-digit verification code to your phone number.<br />Please
                enter it below to complete your registration.
              </p>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Enter OTP Code</label>
              <input
                type="text"
                name="otp"
                class="form-control form-control-lg text-center"
                placeholder="000000"
                maxlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
                style="letter-spacing: 8px; font-size: 24px; font-weight: bold"
              />
            </div>
            <div class="alert alert-info">
              <small
                >&#128336; Code expires in:
                <span id="countdown">5:00</span></small
              >
            </div>
            <button
              type="submit"
              name="verify_otp"
              class="btn btn-accent w-100 py-2 fw-semibold"
            >
              Verify OTP
            </button>
          </form>
          <hr class="my-4" />
          <div class="text-center">
            <p class="text-muted small mb-2">Didn't receive the code?</p>
            <form method="POST" class="d-inline" id="resend-form">
              <input type="hidden" name="resend_otp" value="1" />
              <button
                type="submit"
                class="btn btn-outline-primary btn-sm"
                id="resendBtn"
              >
                &#128266; Resend OTP
              </button>
            </form>
          </div>
          <div class="text-center mt-3">
            <a href="/scan2borrow/register" class="text-decoration-none small"
              >&#8592; Back to Registration</a
            >
          </div>
        </div>
      </div>
    </div>
    <script src="/scan2borrow/frontend/assets/js/pages/otp.js" defer></script>
    <script src="/scan2borrow/frontend/assets/js/core/icons.js" defer></script>
  </body>
</html>
