<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf" content="" />
    <title>Verify OTP | Scan2Borrow</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="frontend/assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-head"><h3>Verify Registration</h3></div>
        <div class="auth-body">
          <p class="text-muted">
            Enter the six-digit OTP sent to your contact number.
          </p>
          <div id="form-error" class="alert alert-danger" hidden></div>
          <div id="form-success" class="alert alert-success" hidden></div>
          <form method="post" id="otp-form">
            <input
              class="form-control form-control-lg text-center mb-3"
              name="otp"
              maxlength="6"
              pattern="[0-9]{6}"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="000000"
              required
            /><button class="btn btn-primary w-100">Verify OTP</button>
          </form>
          <form method="post" id="resend-form" class="mt-3">
            <button class="btn btn-outline-secondary w-100" name="resend_otp">
              Resend OTP
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="frontend/assets/js/pages/otp.js" defer></script>
  </body>
</html>
